name: Axiom Yield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: SAP Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install luminark canonical package from LASE
        run: |
          pip install "luminark @ git+https://github.com/foreverforward760-crypto/LUMINARK-Axiom-Systems-Engine-LASE-v1.1.git#subdirectory=core"

      - name: Install app dependencies
        run: |
          pip install fastapi uvicorn pydantic aiohttp python-dotenv slowapi pytest

      - name: Run SAP engine tests
        run: pytest tests/ -v --tb=short

  lint-constants:
    name: Hardcoded Magic Number Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail if raw 1.45 appears in backend Python
        run: |
          HITS=$(grep -rn '\*\s*1\.45\|1\.45\s*\*' backend/ \
                 --include="*.py" \
                 --exclude="sap_constants.py" || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: Hardcoded 1.45 found in backend code."
            echo "Use VESSEL_OF_GROUNDING_TRAP_AMPLIFIER from luminark.sap_energy_layer"
            echo ""
            echo "$HITS"
            exit 1
          fi
          echo "OK: No hardcoded 1.45 found"

  drift-guard:
    name: Local luminark Copy Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail if sap_energy_layer.py exists locally (must use pip package)
        run: |
          if [ -f "backend/luminark/sap_energy_layer.py" ]; then
            echo "ERROR: backend/luminark/sap_energy_layer.py must not exist."
            echo "This file drifts from the canonical LASE package."
            echo "Use: from luminark.sap_energy_layer import evaluate_trap"
            exit 1
          fi
          echo "OK: No local sap_energy_layer.py copy found"
